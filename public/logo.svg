<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad64" x1="10" y1="5" x2="54" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#111115" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gitStroke64" x1="22" y1="18" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="borderGrad64" x1="10" y1="5" x2="54" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>
    <filter id="coreGlow" x="20" y="24" width="24" height="24" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.063 0 0 0 0 0.725 0 0 0 0 0.506 0 0 0 0.6 0" />
      <feBlend mode="over" in="SourceGraphic" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="#10b981" fill-opacity="0.08" filter="url(#coreGlow)" />

  <!-- Outer Shield Armor -->
  <path
    d="M32 5 L54 14.5 V31 C54 45.5 44.5 55.2 32 59.5 C19.5 55.2 10 45.5 10 31 V14.5 Z"
    fill="url(#shieldGrad64)"
    stroke="url(#borderGrad64)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Beveled Inset Defense Line -->
  <path
    d="M32 9.5 L49 17 V30.5 C49 42.5 41.2 50.8 32 54.4 C22.8 50.8 15 42.5 15 30.5 V17 Z"
    fill="none"
    stroke="#27272a"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />

  <!-- Git Branching Pipeline Paths -->
  <!-- Left Branch Path -->
  <path
    d="M32 19 C32 26 22 26 22 32 C22 38 32 38 32 45"
    stroke="url(#gitStroke64)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Branch Path -->
  <path
    d="M32 19 C32 26 42 26 42 32 C42 38 32 38 32 45"
    stroke="url(#gitStroke64)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Direct Flow Line -->
  <line x1="32" y1="19" x2="32" y2="45" stroke="#10b981" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5" />

  <!-- Commit Nodes -->
  <!-- Source Root Commit -->
  <circle cx="32" cy="19" r="4.2" fill="#09090b" stroke="#10b981" stroke-width="2.8" />
  <circle cx="32" cy="19" r="1.5" fill="#34d399" />
  
  <!-- Left AST Taint Node -->
  <circle cx="22" cy="32" r="4.2" fill="#09090b" stroke="#34d399" stroke-width="2.8" />
  <circle cx="22" cy="32" r="1.5" fill="#10b981" />
  
  <!-- Right Remediation PR Branch Node -->
  <circle cx="42" cy="32" r="4.2" fill="#09090b" stroke="#34d399" stroke-width="2.8" />
  <circle cx="42" cy="32" r="1.5" fill="#10b981" />
  
  <!-- Target Merged Baseline Commit -->
  <circle cx="32" cy="45" r="4.5" fill="#10b981" stroke="#09090b" stroke-width="2" />
  <circle cx="32" cy="45" r="1.8" fill="#ffffff" />

  <!-- Center AI Reasoning Diamond Spark -->
  <path
    d="M32 27.5 L35 32 L32 36.5 L29 32 Z"
    fill="#ffffff"
    stroke="#10b981"
    stroke-width="1"
  />
</svg>
